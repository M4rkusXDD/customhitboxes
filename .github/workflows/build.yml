name: Build Hitbox Customizer

# Single-file setup: this workflow writes the whole mod project, then builds the jar.
# Put it at .github/workflows/build.yml, push, then open Actions > latest run > Artifacts.
# Push a tag like v1.0.0 to also attach the jar to a GitHub Release.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Write mod project files
        run: |
          mkdir -p mod && cd mod
          cat > settings.gradle <<'HB_EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'hitbox-customizer'
          HB_EOF
          cat > gradle.properties <<'HB_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Minecraft / Fabric (1.21.11 is the last version that uses Yarn)
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          fabric_version=0.141.3+1.21.11

          # Mod Menu is compile-only (optional at runtime)
          modmenu_version=17.0.0

          # Mod metadata
          mod_version=1.0.0
          maven_group=com.hitboxcustomizer
          archives_base_name=hitbox-customizer
          HB_EOF
          cat > build.gradle <<'HB_EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              maven { url "https://maven.terraformersmc.com/releases/" }
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

              // Only needed to compile the Mod Menu entrypoint. Players install Mod Menu themselves.
              modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          HB_EOF
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'HB_EOF'
          {
            "schemaVersion": 1,
            "id": "hitboxcustomizer",
            "version": "${version}",
            "name": "Hitbox Customizer",
            "description": "Customize the color and visibility of every entity's hitbox. Press H to open the menu.",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.hitboxcustomizer.HitboxCustomizerClient"],
              "modmenu": ["com.hitboxcustomizer.gui.ModMenuIntegration"]
            },
            "mixins": ["hitboxcustomizer.mixins.json"],
            "depends": {
              "fabricloader": ">=0.18.1",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            },
            "suggests": {
              "modmenu": "*"
            }
          }
          HB_EOF
          mkdir -p src/main/resources
          cat > src/main/resources/hitboxcustomizer.mixins.json <<'HB_EOF'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.hitboxcustomizer.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "DebugRendererMixin",
              "EntityHitboxDebugRendererMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          HB_EOF
          mkdir -p src/main/resources/assets/hitboxcustomizer/lang
          cat > src/main/resources/assets/hitboxcustomizer/lang/en_us.json <<'HB_EOF'
          {
            "key.category.hitboxcustomizer.main": "Hitbox Customizer",
            "key.hitboxcustomizer.open_menu": "Open Hitbox Menu",
            "key.hitboxcustomizer.toggle_hitboxes": "Toggle Hitboxes"
          }
          HB_EOF
          mkdir -p src/main/java/com/hitboxcustomizer
          cat > src/main/java/com/hitboxcustomizer/EntityColors.java <<'HB_EOF'
          package com.hitboxcustomizer;

          import java.util.HashMap;
          import java.util.Map;

          /** Themed colors used by the "preset colors" option. Unknown entities get a stable color from a hash. */
          public final class EntityColors {
              private static final Map<String, Integer> BY_PATH = new HashMap<>();

              private static void put(int rgb, String... paths) {
                  for (String p : paths) {
                      BY_PATH.put(p, rgb);
                  }
              }

              static {
                  // Players and NPCs
                  put(0x3FA7D6, "player");
                  put(0xB07A4B, "villager", "wandering_trader");
                  put(0xD9C8A0, "llama", "trader_llama");

                  // Undead
                  put(0x2E8B57, "zombie");
                  put(0x7CA35A, "zombie_villager");
                  put(0xB89F6A, "husk");
                  put(0x3AA7A0, "drowned");
                  put(0xE8A090, "zombified_piglin");
                  put(0xC8C8C8, "skeleton");
                  put(0x9AD7E8, "stray");
                  put(0x6B8E4E, "bogged");
                  put(0x6E6E78, "wither_skeleton");
                  put(0x7A7A9A, "wither");
                  put(0xC9B8E8, "phantom");

                  // Hostile
                  put(0x4CAF50, "creeper");
                  put(0x7A2E2E, "spider");
                  put(0x1E8FB0, "cave_spider");
                  put(0xA040E0, "enderman");
                  put(0x7B3FA0, "endermite");
                  put(0xC99BD6, "shulker");
                  put(0xFFA500, "blaze");
                  put(0xF5F5F5, "ghast");
                  put(0xD9531E, "magma_cube");
                  put(0x7EBF6E, "slime");
                  put(0x9B59B6, "witch");
                  put(0x5A6B6B, "pillager");
                  put(0x7A8C8C, "vindicator");
                  put(0xD0D0D0, "evoker");
                  put(0x6C6C73, "ravager");
                  put(0x9FC5E8, "vex");
                  put(0x3B5BA8, "illusioner");
                  put(0x1A8C9E, "warden");
                  put(0xB347FF, "ender_dragon");
                  put(0xAAB7C4, "silverfish");
                  put(0x4FB3A5, "guardian");
                  put(0xB59A8C, "elder_guardian");
                  put(0x8EC9E8, "breeze");
                  put(0x8A6A4F, "creaking");

                  // Nether
                  put(0xE0A87A, "piglin");
                  put(0xC0794C, "piglin_brute");
                  put(0xC77A5A, "hoglin");
                  put(0x9A8B6A, "zoglin");
                  put(0xD13B3B, "strider");

                  // Passive land
                  put(0xF4A6B4, "pig");
                  put(0x6B4A3A, "cow");
                  put(0xD32F2F, "mooshroom");
                  put(0xE8E8E8, "sheep");
                  put(0xF5F0DC, "chicken");
                  put(0x8B5A2B, "horse");
                  put(0x8A7F73, "donkey");
                  put(0x5E4B3C, "mule");
                  put(0xD8C9A8, "skeleton_horse");
                  put(0x7FA67A, "zombie_horse");
                  put(0xCFCFCF, "wolf");
                  put(0xE0A050, "cat");
                  put(0xE3B04B, "ocelot");
                  put(0xE87A2F, "fox");
                  put(0xB89A7A, "rabbit");
                  put(0xF2C230, "bee");
                  put(0xDDDDDD, "panda");
                  put(0xF8F8FF, "polar_bear");
                  put(0xE0DCD5, "goat");
                  put(0xD8B36A, "camel", "camel_husk");
                  put(0xB0413E, "sniffer");
                  put(0xE53935, "parrot");
                  put(0x6B5B4B, "bat");
                  put(0xF4A6C8, "axolotl");
                  put(0x7BAE5A, "frog");
                  put(0x4E6B3E, "tadpole");
                  put(0x4F8F3F, "turtle");
                  put(0xDAD3E8, "happy_ghast");

                  // Water
                  put(0x2F6EA5, "squid");
                  put(0x39D6C4, "glow_squid");
                  put(0x6E93AE, "dolphin");
                  put(0xC9A66B, "cod");
                  put(0xB5483A, "salmon");
                  put(0xE8D44D, "pufferfish");
                  put(0xFF8C42, "tropical_fish");

                  // Golems and helpers
                  put(0xC9C9C9, "iron_golem");
                  put(0xF0F8FF, "snow_golem");
                  put(0xC77B4A, "copper_golem");
                  put(0x4FC3F7, "allay");

                  // Objects
                  put(0xB38B5D, "armor_stand");
                  put(0xE6C84A, "item");
                  put(0x7CFC00, "experience_orb");
                  put(0xA0A0A0, "arrow", "spectral_arrow");
                  put(0x80CBC4, "trident");
                  put(0xFF6A00, "fireball", "small_fireball", "dragon_fireball");
                  put(0xE53935, "tnt");
                  put(0xA1887F, "falling_block");
                  put(0x8D6E63, "oak_boat", "spruce_boat", "birch_boat", "jungle_boat", "acacia_boat",
                      "dark_oak_boat", "mangrove_boat", "cherry_boat", "pale_oak_boat", "bamboo_raft");
                  put(0x90A4AE, "minecart", "chest_minecart", "furnace_minecart", "hopper_minecart",
                      "tnt_minecart", "spawner_minecart", "command_block_minecart");
                  put(0xFF66CC, "end_crystal");
                  put(0xFFFF66, "lightning_bolt");
                  put(0x66BB6A, "ender_pearl", "snowball", "egg");
                  put(0xFFB74D, "item_frame", "glow_item_frame", "painting");
              }

              private EntityColors() {
              }

              public static int forId(String id) {
                  int colon = id.indexOf(':');
                  String namespace = colon >= 0 ? id.substring(0, colon) : "minecraft";
                  String path = colon >= 0 ? id.substring(colon + 1) : id;

                  if (namespace.equals("minecraft")) {
                      Integer known = BY_PATH.get(path);
                      if (known != null) {
                          return known;
                      }
                  }
                  // Stable fallback color so modded entities are still distinguishable.
                  int hash = id.hashCode();
                  float hue = ((hash & 0x7FFFFFFF) % 360) / 360.0f;
                  return hsvToRgb(hue, 0.65f, 1.0f);
              }

              public static int hsvToRgb(float h, float s, float v) {
                  float c = v * s;
                  float hp = (h * 6.0f) % 6.0f;
                  float x = c * (1.0f - Math.abs(hp % 2.0f - 1.0f));
                  float r = 0, g = 0, b = 0;
                  switch ((int) hp) {
                      case 0 -> { r = c; g = x; }
                      case 1 -> { r = x; g = c; }
                      case 2 -> { g = c; b = x; }
                      case 3 -> { g = x; b = c; }
                      case 4 -> { r = x; b = c; }
                      default -> { r = c; b = x; }
                  }
                  float m = v - c;
                  int ri = Math.round((r + m) * 255.0f);
                  int gi = Math.round((g + m) * 255.0f);
                  int bi = Math.round((b + m) * 255.0f);
                  return (ri << 16) | (gi << 8) | bi;
              }

              /** Returns {h, s, v}, each in 0..1. */
              public static float[] rgbToHsv(int rgb) {
                  float r = ((rgb >> 16) & 0xFF) / 255.0f;
                  float g = ((rgb >> 8) & 0xFF) / 255.0f;
                  float b = (rgb & 0xFF) / 255.0f;
                  float max = Math.max(r, Math.max(g, b));
                  float min = Math.min(r, Math.min(g, b));
                  float d = max - min;
                  float h;
                  if (d == 0) {
                      h = 0;
                  } else if (max == r) {
                      h = ((g - b) / d) % 6.0f;
                  } else if (max == g) {
                      h = (b - r) / d + 2.0f;
                  } else {
                      h = (r - g) / d + 4.0f;
                  }
                  h /= 6.0f;
                  if (h < 0) {
                      h += 1.0f;
                  }
                  float s = max == 0 ? 0 : d / max;
                  return new float[]{h, s, max};
              }
          }
          HB_EOF
          mkdir -p src/main/java/com/hitboxcustomizer
          cat > src/main/java/com/hitboxcustomizer/HitboxCustomizerClient.java <<'HB_EOF'
          package com.hitboxcustomizer;

          import com.hitboxcustomizer.config.HitboxConfig;
          import com.hitboxcustomizer.gui.HitboxMenuScreen;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;

          public class HitboxCustomizerClient implements ClientModInitializer {
              public static final String MOD_ID = "hitboxcustomizer";

              private static final KeyBinding.Category CATEGORY =
                  KeyBinding.Category.create(Identifier.of(MOD_ID, "main"));

              private static KeyBinding openMenuKey;
              private static KeyBinding toggleHitboxesKey;

              @Override
              public void onInitializeClient() {
                  HitboxConfig.load();

                  // Opens the menu. Defaults to H, rebindable in Options > Controls.
                  openMenuKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                      "key.hitboxcustomizer.open_menu", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_H, CATEGORY));

                  // Quick on/off for hitboxes (same effect as F3+B). Unbound by default.
                  toggleHitboxesKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                      "key.hitboxcustomizer.toggle_hitboxes", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_UNKNOWN, CATEGORY));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (openMenuKey.wasPressed()) {
                          if (client.currentScreen == null) {
                              client.setScreen(new HitboxMenuScreen(null));
                          }
                      }
                      while (toggleHitboxesKey.wasPressed()) {
                          HitboxRenderer.quickToggle(client);
                      }
                  });
              }
          }
          HB_EOF
          mkdir -p src/main/java/com/hitboxcustomizer
          cat > src/main/java/com/hitboxcustomizer/HitboxRenderer.java <<'HB_EOF'
          package com.hitboxcustomizer;

          import com.hitboxcustomizer.config.HitboxConfig;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.render.DrawStyle;
          import net.minecraft.client.render.Frustum;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.EntityType;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.boss.dragon.EnderDragonEntity;
          import net.minecraft.entity.boss.dragon.EnderDragonPart;
          import net.minecraft.registry.Registries;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.math.Box;
          import net.minecraft.util.math.Vec3d;
          import net.minecraft.world.debug.gizmo.GizmoDrawing;

          import java.util.HashMap;
          import java.util.Map;

          /**
           * Draws hitboxes itself and silences vanilla's per-entity drawing, so color and visibility can be
           * controlled per entity type. Vanilla's F3+B state is still respected: "Default" visibility means
           * "visible while F3+B (or the quick toggle hotkey) has hitboxes on".
           */
          public final class HitboxRenderer {
              private static final Identifier VANILLA_HITBOX_ENTRY = Identifier.ofVanilla("entity_hitboxes");
              private static final Map<EntityType<?>, String> ID_CACHE = new HashMap<>();

              /** Set by the vanilla hitbox renderer mixin whenever vanilla would draw hitboxes this frame. */
              public static boolean vanillaSeen = false;
              private static boolean vanillaActive = false;
              /** State of the quick toggle hotkey. */
              private static boolean quickOn = false;

              private HitboxRenderer() {
              }

              public static boolean isDefaultOn() {
                  return quickOn || vanillaActive;
              }

              public static void quickToggle(MinecraftClient mc) {
                  if (isDefaultOn()) {
                      quickOn = false;
                      if (vanillaActive) {
                          try {
                              mc.debugHudEntryList.toggleVisibility(VANILLA_HITBOX_ENTRY);
                          } catch (Throwable ignored) {
                              // If this ever fails, F3+B still works for turning vanilla hitboxes off.
                          }
                      }
                  } else {
                      quickOn = true;
                  }
                  if (mc.player != null) {
                      mc.player.sendMessage(Text.literal("Hitboxes: " + (isDefaultOn() ? "ON" : "OFF")), true);
                  }
              }

              public static void onFrame(Frustum frustum, double camX, double camY, double camZ, float tickProgress) {
                  vanillaActive = vanillaSeen;
                  vanillaSeen = false;
                  render(frustum, camX, camY, camZ, tickProgress);
              }

              public static String idOf(Entity entity) {
                  return ID_CACHE.computeIfAbsent(entity.getType(), t -> Registries.ENTITY_TYPE.getId(t).toString());
              }

              private static void render(Frustum frustum, double camX, double camY, double camZ, float tickProgress) {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  HitboxConfig cfg = HitboxConfig.get();
                  if (!cfg.enabled || mc.world == null) {
                      return;
                  }

                  boolean defaultOn = isDefaultOn();
                  boolean firstPerson = mc.options.getPerspective().isFirstPerson();
                  double maxSq = (double) cfg.maxDistance * cfg.maxDistance;

                  for (Entity entity : mc.world.getEntities()) {
                      if (entity == mc.player && firstPerson) {
                          continue;
                      }

                      String id = idOf(entity);
                      boolean show = switch (cfg.modeFor(id)) {
                          case ALWAYS -> true;
                          case NEVER -> false;
                          case DEFAULT -> defaultOn;
                      };
                      if (!show) {
                          continue;
                      }
                      if (entity.squaredDistanceTo(camX, camY, camZ) > maxSq) {
                          continue;
                      }

                      Vec3d lerped = entity.getLerpedPos(tickProgress);
                      Box box = entity.getBoundingBox().offset(
                          lerped.x - entity.getX(), lerped.y - entity.getY(), lerped.z - entity.getZ());
                      if (!(entity instanceof EnderDragonEntity) && !frustum.isVisible(box.expand(0.5))) {
                          continue;
                      }

                      int argb = 0xFF000000 | cfg.colorFor(id);
                      GizmoDrawing.box(box, DrawStyle.stroked(argb));

                      if (entity instanceof EnderDragonEntity dragon) {
                          for (EnderDragonPart part : dragon.getBodyParts()) {
                              GizmoDrawing.box(part.getBoundingBox(), DrawStyle.stroked(argb));
                          }
                      }

                      if (entity instanceof LivingEntity) {
                          double eyeY = lerped.y + entity.getStandingEyeHeight();
                          if (cfg.showEyeLine) {
                              Box eye = new Box(box.minX, eyeY - 0.01, box.minZ, box.maxX, eyeY + 0.01, box.maxZ);
                              GizmoDrawing.box(eye, DrawStyle.stroked(0xFFFF0000));
                          }
                          if (cfg.showLookVector) {
                              Vec3d start = new Vec3d(lerped.x, eyeY, lerped.z);
                              Vec3d end = start.add(entity.getRotationVec(tickProgress).multiply(2.0));
                              GizmoDrawing.line(start, end, 0xFF0000FF);
                          }
                      }
                  }
              }
          }
          HB_EOF
          mkdir -p src/main/java/com/hitboxcustomizer/config
          cat > src/main/java/com/hitboxcustomizer/config/HitboxConfig.java <<'HB_EOF'
          package com.hitboxcustomizer.config;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import com.hitboxcustomizer.EntityColors;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.Reader;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.HashMap;
          import java.util.Map;

          public class HitboxConfig {

              public enum Mode {
                  DEFAULT("Default"),
                  ALWAYS("Always on"),
                  NEVER("Never on");

                  private final String label;

                  Mode(String label) {
                      this.label = label;
                  }

                  public String label() {
                      return label;
                  }

                  public Mode next() {
                      Mode[] all = values();
                      return all[(ordinal() + 1) % all.length];
                  }
              }

              public static class EntitySettings {
                  public boolean useCustomColor = false;
                  public int color = 0xFFFFFF;
                  public Mode mode = Mode.DEFAULT;

                  public boolean isDefault() {
                      return !useCustomColor && mode == Mode.DEFAULT;
                  }
              }

              // Master switch. When off, vanilla hitbox rendering is left completely alone.
              public boolean enabled = true;
              // Use a themed color for every entity (creeper green, enderman purple, ...).
              public boolean presetColors = false;
              // Force every hitbox to one color. Wins over everything else.
              public boolean globalColorEnabled = false;
              public int globalColor = 0xFFFFFF;
              // Vanilla extras: red eye-height line and blue look vector.
              public boolean showEyeLine = true;
              public boolean showLookVector = true;
              // Hitboxes farther than this (in blocks) are skipped.
              public int maxDistance = 64;
              // Per entity type settings, keyed by registry id such as "minecraft:creeper".
              public Map<String, EntitySettings> entities = new HashMap<>();

              // ---- lookups ----

              public EntitySettings settings(String id) {
                  return entities.get(id);
              }

              public EntitySettings edit(String id) {
                  return entities.computeIfAbsent(id, key -> new EntitySettings());
              }

              public void tidy(String id) {
                  EntitySettings s = entities.get(id);
                  if (s != null && s.isDefault()) {
                      entities.remove(id);
                  }
              }

              public Mode modeFor(String id) {
                  EntitySettings s = entities.get(id);
                  return s == null || s.mode == null ? Mode.DEFAULT : s.mode;
              }

              /** Priority: global override, then the entity's own color, then preset, then vanilla white. */
              public int colorFor(String id) {
                  if (globalColorEnabled) {
                      return globalColor & 0xFFFFFF;
                  }
                  EntitySettings s = entities.get(id);
                  if (s != null && s.useCustomColor) {
                      return s.color & 0xFFFFFF;
                  }
                  if (presetColors) {
                      return EntityColors.forId(id);
                  }
                  return 0xFFFFFF;
              }

              public String colorSource(String id) {
                  if (globalColorEnabled) {
                      return "Override-all color";
                  }
                  EntitySettings s = entities.get(id);
                  if (s != null && s.useCustomColor) {
                      return "Custom color";
                  }
                  if (presetColors) {
                      return "Preset color";
                  }
                  return "Vanilla white";
              }

              // ---- persistence ----

              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static HitboxConfig instance = new HitboxConfig();

              public static HitboxConfig get() {
                  return instance;
              }

              private static Path path() {
                  return FabricLoader.getInstance().getConfigDir().resolve("hitboxcustomizer.json");
              }

              public static void load() {
                  Path p = path();
                  if (Files.exists(p)) {
                      try (Reader reader = Files.newBufferedReader(p)) {
                          HitboxConfig loaded = GSON.fromJson(reader, HitboxConfig.class);
                          if (loaded != null) {
                              instance = loaded;
                          }
                      } catch (Exception e) {
                          System.err.println("[Hitbox Customizer] Could not read config, using defaults: " + e);
                      }
                  }
                  instance.normalize();
                  save();
              }

              public static void save() {
                  try {
                      Files.writeString(path(), GSON.toJson(instance));
                  } catch (Exception e) {
                      System.err.println("[Hitbox Customizer] Could not write config: " + e);
                  }
              }

              private void normalize() {
                  if (entities == null) {
                      entities = new HashMap<>();
                  }
                  entities.values().removeIf(s -> s == null);
                  for (EntitySettings s : entities.values()) {
                      if (s.mode == null) {
                          s.mode = Mode.DEFAULT;
                      }
                  }
                  maxDistance = Math.max(8, Math.min(512, maxDistance));
              }
          }
