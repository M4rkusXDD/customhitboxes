          package com.hitboxcustomizer.gui;

          import net.minecraft.client.font.TextRenderer;
          import net.minecraft.client.gui.DrawContext;

          import java.util.function.IntSupplier;
          import java.util.function.Supplier;

          /** Tiny hand-drawn button so the screens depend on as little vanilla widget API as possible. */
          final class UiButton {
              final int x;
              final int y;
              final int w;
              final int h;
              private final Supplier<String> label;
              private final Runnable action;
              private IntSupplier swatch;

              UiButton(int x, int y, int w, int h, Supplier<String> label, Runnable action) {
                  this.x = x;
                  this.y = y;
                  this.w = w;
                  this.h = h;
                  this.label = label;
                  this.action = action;
              }

              UiButton withSwatch(IntSupplier swatch) {
                  this.swatch = swatch;
                  return this;
              }

              boolean contains(double mx, double my) {
                  return mx >= x && mx < x + w && my >= y && my < y + h;
              }

              void click() {
                  action.run();
              }

              void draw(DrawContext g, TextRenderer font, int mx, int my) {
                  boolean hovered = contains(mx, my);
                  g.fill(x, y, x + w, y + h, hovered ? Theme.CARD_HOVER : Theme.CARD);
                  g.drawStrokedRectangle(x, y, w, h, hovered ? Theme.ACCENT : Theme.BORDER);

                  String text = label.get();
                  int textW = font.getWidth(text);
                  int swatchW = swatch != null ? 14 : 0;
                  int startX = x + (w - (textW + swatchW)) / 2;
                  int textY = y + (h - 8) / 2;

                  if (swatch != null) {
                      int sy = y + (h - 10) / 2;
                      g.fill(startX, sy, startX + 10, sy + 10, 0xFF000000 | swatch.getAsInt());
                      g.drawStrokedRectangle(startX, sy, 10, 10, 0x80FFFFFF);
                      startX += swatchW;
                  }
                  g.drawText(font, text, startX, textY, Theme.TEXT, false);
              }
          }
