          package com.hitboxcustomizer.gui;

          import com.hitboxcustomizer.HitboxRenderer;
          import com.hitboxcustomizer.config.HitboxConfig;
          import net.minecraft.client.gui.Click;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.TextFieldWidget;
          import net.minecraft.entity.EntityType;
          import net.minecraft.registry.Registries;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.math.MathHelper;

          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Locale;

          /** Main menu: global options on top, searchable list of every entity type below. */
          public class HitboxMenuScreen extends Screen {
              private static final int ROW_H = 24;

              private record Entry(String id, String name, String haystack) {
              }

              private static List<Entry> cachedEntries;

              private final Screen parent;
              private final List<UiButton> buttons = new ArrayList<>();
              private List<Entry> filtered = new ArrayList<>();
              private TextFieldWidget search;
              private int firstRow = 0;
              private int listTop;
              private int listBottom;
              private int left;
              private int panelW;

              public HitboxMenuScreen(Screen parent) {
                  super(Text.literal("Hitbox Customizer"));
                  this.parent = parent;
              }

              private static List<Entry> entries() {
                  if (cachedEntries == null) {
                      List<Entry> list = new ArrayList<>();
                      for (EntityType<?> type : Registries.ENTITY_TYPE) {
                          Identifier id = Registries.ENTITY_TYPE.getId(type);
                          String name = type.getName().getString();
                          list.add(new Entry(id.toString(), name, (name + " " + id).toLowerCase(Locale.ROOT)));
                      }
                      list.sort(Comparator.comparing(e -> e.name().toLowerCase(Locale.ROOT)));
                      cachedEntries = list;
                  }
                  return cachedEntries;
              }

              @Override
              protected void init() {
                  HitboxConfig cfg = HitboxConfig.get();
                  buttons.clear();

                  panelW = Math.min(this.width - 20, 440);
                  left = (this.width - panelW) / 2;
                  int gap = 6;
                  int bw = (panelW - gap * 2) / 3;
                  int row1 = 30;
                  int row2 = 52;

                  buttons.add(new UiButton(left, row1, bw, 18,
                      () -> "Mod: " + (cfg.enabled ? "ON" : "OFF"),
                      () -> {
                          cfg.enabled = !cfg.enabled;
                          HitboxConfig.save();
                      }));
                  buttons.add(new UiButton(left + bw + gap, row1, bw, 18,
                      () -> "Hitboxes now: " + (HitboxRenderer.isDefaultOn() ? "ON" : "OFF"),
                      () -> HitboxRenderer.quickToggle(this.client)));
                  buttons.add(new UiButton(left + (bw + gap) * 2, row1, bw, 18,
                      () -> "Preset colors: " + (cfg.presetColors ? "ON" : "OFF"),
                      () -> {
                          cfg.presetColors = !cfg.presetColors;
                          HitboxConfig.save();
                      }));

                  buttons.add(new UiButton(left, row2, bw, 18,
                      () -> "Override all: " + (cfg.globalColorEnabled ? "ON" : "OFF"),
                      () -> {
                          cfg.globalColorEnabled = !cfg.globalColorEnabled;
                          HitboxConfig.save();
                      }));
                  buttons.add(new UiButton(left + bw + gap, row2, bw, 18,
                      () -> "Override color...",
                      () -> this.client.setScreen(new ColorPickerScreen(this, "Color for all hitboxes", cfg.globalColor, rgb -> {
                          cfg.globalColor = rgb;
                          cfg.globalColorEnabled = true;
                          HitboxConfig.save();
                      }))).withSwatch(() -> cfg.globalColor));
                  buttons.add(new UiButton(left + (bw + gap) * 2, row2, bw, 18,
                      () -> "Eye/look lines: " + (cfg.showEyeLine ? "ON" : "OFF"),
                      () -> {
                          boolean next = !cfg.showEyeLine;
                          cfg.showEyeLine = next;
                          cfg.showLookVector = next;
                          HitboxConfig.save();
                      }));

                  search = new TextFieldWidget(this.textRenderer, left, 76, panelW, 18, Text.literal("Search"));
                  search.setPlaceholder(Text.literal("Search any entity (name or id)..."));
                  search.setMaxLength(64);
                  search.setChangedListener(text -> {
                      refilter(text);
                      firstRow = 0;
                  });
                  addDrawableChild(search);
                  setInitialFocus(search);

                  listTop = 100;
                  listBottom = this.height - 30;

                  buttons.add(new UiButton((this.width - 100) / 2, this.height - 24, 100, 18, () -> "Done", this::close));

                  refilter(search.getText());
              }

              private void refilter(String query) {
                  String[] tokens = query.toLowerCase(Locale.ROOT).trim().split("\\s+");
                  List<Entry> out = new ArrayList<>();
                  for (Entry e : entries()) {
                      boolean ok = true;
                      for (String t : tokens) {
                          if (!t.isEmpty() && !e.haystack().contains(t)) {
                              ok = false;
                              break;
                          }
                      }
                      if (ok) {
                          out.add(e);
                      }
                  }
                  filtered = out;
              }

              private int visibleRows() {
                  return Math.max(1, (listBottom - listTop) / ROW_H);
              }

              private int maxFirstRow() {
                  return Math.max(0, filtered.size() - visibleRows());
              }

              @Override
              public void render(DrawContext g, int mouseX, int mouseY, float delta) {
                  HitboxConfig cfg = HitboxConfig.get();
                  g.fill(0, 0, this.width, this.height, Theme.DIM_BG);

                  g.drawText(this.textRenderer, this.title, left, 12, Theme.TEXT, false);
                  String hint = "Click an entity to edit it";
                  g.drawText(this.textRenderer, hint, left + panelW - this.textRenderer.getWidth(hint), 12, Theme.DIM, false);

                  firstRow = MathHelper.clamp(firstRow, 0, maxFirstRow());
                  int rows = visibleRows();

                  g.fill(left, listTop, left + panelW, listBottom, Theme.PANEL);
                  g.drawStrokedRectangle(left, listTop, panelW, listBottom - listTop, Theme.BORDER);

                  for (int i = 0; i < rows; i++) {
                      int index = firstRow + i;
                      if (index >= filtered.size()) {
                          break;
                      }
                      Entry e = filtered.get(index);
                      int y = listTop + i * ROW_H;
                      boolean hovered = mouseX >= left && mouseX < left + panelW - 6 && mouseY >= y && mouseY < y + ROW_H;
                      if (hovered) {
                          g.fill(left + 1, y, left + panelW - 1, y + ROW_H, Theme.CARD_HOVER);
                      } else if (i % 2 == 1) {
                          g.fill(left + 1, y, left + panelW - 1, y + ROW_H, Theme.CARD);
                      }

                      int color = cfg.colorFor(e.id());
                      g.fill(left + 8, y + 5, left + 22, y + 19, 0xFF000000 | color);
                      g.drawStrokedRectangle(left + 8, y + 5, 14, 14, 0x80FFFFFF);
                      g.drawText(this.textRenderer, e.name(), left + 30, y + 4, Theme.TEXT, false);
                      g.drawText(this.textRenderer, e.id(), left + 30, y + 14, Theme.DIM, false);

                      HitboxConfig.Mode mode = cfg.modeFor(e.id());
                      HitboxConfig.EntitySettings s = cfg.settings(e.id());
                      String tag = mode == HitboxConfig.Mode.DEFAULT ? "" : mode.label();
                      if (s != null && s.useCustomColor) {
                          tag = tag.isEmpty() ? "Custom" : tag + " | Custom";
                      }
                      if (!tag.isEmpty()) {
                          int tagColor = mode == HitboxConfig.Mode.NEVER ? Theme.BAD
                              : mode == HitboxConfig.Mode.ALWAYS ? Theme.GOOD : Theme.DIM;
                          g.drawText(this.textRenderer, tag, left + panelW - 14 - this.textRenderer.getWidth(tag), y + 8, tagColor, false);
                      }
                  }

                  if (filtered.isEmpty()) {
                      g.drawText(this.textRenderer, "No entities match your search.", left + 10, listTop + 10, Theme.DIM, false);
                  }

                  // Scrollbar.
                  if (filtered.size() > rows) {
                      int trackH = listBottom - listTop - 4;
                      int barH = Math.max(16, trackH * rows / filtered.size());
                      int barY = listTop + 2 + (maxFirstRow() == 0 ? 0 : (trackH - barH) * firstRow / maxFirstRow());
                      g.fill(left + panelW - 5, barY, left + panelW - 2, barY + barH, Theme.ACCENT);
                  }

                  String count = filtered.size() + " entities";
                  g.drawText(this.textRenderer, count, left, this.height - 20, Theme.DIM, false);

                  super.render(g, mouseX, mouseY, delta);

                  for (UiButton b : buttons) {
                      b.draw(g, this.textRenderer, mouseX, mouseY);
                  }
              }

              @Override
              public boolean mouseClicked(Click click, boolean doubled) {
                  if (super.mouseClicked(click, doubled)) {
                      return true;
                  }
                  if (click.button() != 0) {
                      return false;
                  }
                  double mx = click.x();
                  double my = click.y();

                  for (UiButton b : buttons) {
                      if (b.contains(mx, my)) {
                          b.click();
                          return true;
                      }
                  }

                  if (mx >= left && mx < left + panelW - 6 && my >= listTop && my < listBottom) {
                      int row = (int) ((my - listTop) / ROW_H);
                      int index = firstRow + row;
                      if (row < visibleRows() && index < filtered.size()) {
                          Entry e = filtered.get(index);
                          this.client.setScreen(new EntityEditScreen(this, e.id(), e.name()));
                          return true;
                      }
                  }
                  return false;
              }

              @Override
              public boolean mouseScrolled(double mouseX, double mouseY, double horizontalAmount, double verticalAmount) {
                  if (mouseY >= listTop && mouseY < listBottom) {
                      int step = verticalAmount > 0 ? -1 : 1;
                      firstRow = MathHelper.clamp(firstRow + step * 2, 0, maxFirstRow());
                      return true;
                  }
                  return super.mouseScrolled(mouseX, mouseY, horizontalAmount, verticalAmount);
              }

              @Override
              public void removed() {
                  HitboxConfig.save();
              }

              @Override
              public void close() {
                  this.client.setScreen(parent);
              }
          }
