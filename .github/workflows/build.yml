          package com.hitboxcustomizer.gui;

          import com.hitboxcustomizer.EntityColors;
          import com.hitboxcustomizer.config.HitboxConfig;
          import net.minecraft.client.gui.Click;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.text.Text;

          import java.util.ArrayList;
          import java.util.List;

          /** Color and visibility settings for one entity type. */
          public class EntityEditScreen extends Screen {
              private static final int PW = 320;
              private static final int BASE_PH = 254;

              private final Screen parent;
              private final String entityId;
              private final String entityName;
              private final List<UiButton> buttons = new ArrayList<>();

              public EntityEditScreen(Screen parent, String entityId, String entityName) {
                  super(Text.literal(entityName));
                  this.parent = parent;
                  this.entityId = entityId;
                  this.entityName = entityName;
              }

              private int px() {
                  return (this.width - PW) / 2;
              }

              private boolean isPlayer() {
                  return entityId.equals("minecraft:player");
              }

              private int ph() {
                  return BASE_PH + (isPlayer() ? 32 : 0);
              }

              private int py() {
                  return (this.height - ph()) / 2;
              }

              @Override
              protected void init() {
                  buttons.clear();
                  HitboxConfig cfg = HitboxConfig.get();
                  int x = px() + 14;
                  int w = PW - 28;
                  int y = py() + 92;

                  buttons.add(new UiButton(x, y, w, 18,
                      () -> "Use custom color: " + (isCustom() ? "ON" : "OFF"),
                      () -> {
                          HitboxConfig.EntitySettings s = cfg.edit(entityId);
                          s.useCustomColor = !s.useCustomColor;
                          save();
                      }));

                  buttons.add(new UiButton(x, y + 22, w, 18,
                      () -> "Choose color...",
                      () -> {
                          HitboxConfig.EntitySettings s = cfg.edit(entityId);
                          this.client.setScreen(new ColorPickerScreen(this, "Hitbox color: " + entityName, s.color, EntityColors.palette(entityId), rgb -> {
                              HitboxConfig.EntitySettings edited = cfg.edit(entityId);
                              edited.color = rgb;
                              edited.useCustomColor = true;
                              save();
                          }));
                      }).withSwatch(() -> {
                          HitboxConfig.EntitySettings s = cfg.settings(entityId);
                          return s == null ? 0xFFFFFF : s.color;
                      }));

                  buttons.add(new UiButton(x, y + 44, w, 18,
                      () -> "Show hitbox: " + cfg.modeFor(entityId).label(),
                      () -> {
                          HitboxConfig.EntitySettings s = cfg.edit(entityId);
                          s.mode = s.mode.next();
                          save();
                      }));

                  buttons.add(new UiButton(x, y + 66, 24, 18, () -> "-", () -> {
                      HitboxConfig.EntitySettings s = cfg.edit(entityId);
                      s.thickness = s.thickness <= 0.5f ? 0f : s.thickness - 0.5f;
                      save();
                  }));
                  buttons.add(new UiButton(x + 28, y + 66, w - 56, 18,
                      () -> "Thickness: " + thicknessLabel(), () -> {
                          HitboxConfig.EntitySettings s = cfg.edit(entityId);
                          s.thickness = 0f;
                          save();
                      }));
                  buttons.add(new UiButton(x + w - 24, y + 66, 24, 18, () -> "+", () -> {
                      HitboxConfig.EntitySettings s = cfg.edit(entityId);
                      s.thickness = s.thickness <= 0f ? 1.0f : Math.min(10f, s.thickness + 0.5f);
                      save();
                  }));

                  int half = (w - 6) / 2;
                  buttons.add(new UiButton(x, y + 88, half - 22, 18,
                      () -> "Target: " + (hasTarget() ? "Custom" : "Global"),
                      () -> this.client.setScreen(new ColorPickerScreen(this, "Targeted color: " + entityName,
                          cfg.effectiveTargetColor(entityId), rgb -> {
                              cfg.edit(entityId).targetColor = rgb;
                              save();
                          }))).withSwatch(() -> cfg.effectiveTargetColor(entityId)));
                  buttons.add(new UiButton(x + half - 18, y + 88, 18, 18, () -> "x", () -> {
                      HitboxConfig.EntitySettings s = cfg.settings(entityId);
                      if (s != null) {
                          s.targetColor = null;
                          save();
                      }
                  }));
                  buttons.add(new UiButton(x + half + 6, y + 88, half - 22, 18,
                      () -> "On hit: " + (hasHit() ? "Custom" : "Global"),
                      () -> this.client.setScreen(new ColorPickerScreen(this, "On-hit color: " + entityName,
                          cfg.effectiveHitColor(entityId), rgb -> {
                              cfg.edit(entityId).hitColor = rgb;
                              save();
                          }))).withSwatch(() -> cfg.effectiveHitColor(entityId)));
                  buttons.add(new UiButton(x + w - 18, y + 88, 18, 18, () -> "x", () -> {
                      HitboxConfig.EntitySettings s = cfg.settings(entityId);
                      if (s != null) {
                          s.hitColor = null;
                          save();
                      }
                  }));

                  int bottomY = y + 110;
                  if (isPlayer()) {
                      int halfW = (w - 6) / 2;
                      buttons.add(new UiButton(x, y + 110, halfW, 18, () -> "Elytra only", () -> {
                          HitboxConfig.EntitySettings s = cfg.edit(entityId);
                          s.onlyElytra = !s.onlyElytra;
                          save();
                      }).withCheckbox(() -> {
                          HitboxConfig.EntitySettings s = cfg.settings(entityId);
                          return s != null && s.onlyElytra;
                      }));
                      buttons.add(new UiButton(x + halfW + 6, y + 110, halfW, 18, () -> "Swimming only", () -> {
                          HitboxConfig.EntitySettings s = cfg.edit(entityId);
                          s.onlySwimming = !s.onlySwimming;
                          save();
                      }).withCheckbox(() -> {
                          HitboxConfig.EntitySettings s = cfg.settings(entityId);
                          return s != null && s.onlySwimming;
                      }));
                      bottomY = y + 132;
                  }
                  buttons.add(new UiButton(x, bottomY, (w - 6) / 2, 18,
                      () -> "Reset this entity",
                      () -> {
                          cfg.entities.remove(entityId);
                          HitboxConfig.save();
                      }));

                  buttons.add(new UiButton(x + (w - 6) / 2 + 6, bottomY, (w - 6) / 2, 18,
                      () -> "Back",
                      this::close));
              }

              private int swatchX(int i) {
                  return px() + 64 + i * 18;
              }

              private int swatchY() {
                  return py() + 75;
              }

              private boolean hasTarget() {
                  HitboxConfig.EntitySettings s = HitboxConfig.get().settings(entityId);
                  return s != null && s.targetColor != null;
              }

              private boolean hasHit() {
                  HitboxConfig.EntitySettings s = HitboxConfig.get().settings(entityId);
                  return s != null && s.hitColor != null;
              }

              private String thicknessLabel() {
                  float t = HitboxConfig.get().thicknessFor(entityId);
                  return t <= 0f ? "Default (click to reset)" : String.format("%.1f (click to reset)", t);
              }

              private boolean isCustom() {
                  HitboxConfig.EntitySettings s = HitboxConfig.get().settings(entityId);
                  return s != null && s.useCustomColor;
              }

              private void save() {
                  HitboxConfig.save();
              }

              @Override
              public void render(DrawContext g, int mouseX, int mouseY, float delta) {
                  HitboxConfig cfg = HitboxConfig.get();
                  g.fill(0, 0, this.width, this.height, Theme.DIM_BG);

                  int px = px();
                  int py = py();
                  g.fill(px, py, px + PW, py + ph(), Theme.PANEL);
                  g.drawStrokedRectangle(px, py, PW, ph(), Theme.BORDER);

                  g.drawText(this.textRenderer, entityName, px + 14, py + 10, Theme.TEXT, false);
                  g.drawText(this.textRenderer, entityId, px + 14, py + 22, Theme.DIM, false);

                  int color = cfg.colorFor(entityId);
                  g.fill(px + 14, py + 38, px + 14 + 40, py + 38 + 40, 0xFF000000 | color);
                  g.drawStrokedRectangle(px + 14, py + 38, 40, 40, 0xA0FFFFFF);
                  g.drawText(this.textRenderer, String.format("Current color: #%06X", color), px + 64, py + 46, Theme.TEXT, false);
                  g.drawText(this.textRenderer, "Source: " + cfg.colorSource(entityId), px + 64, py + 58, Theme.DIM, false);

                  g.drawText(this.textRenderer, "Recommended colors (click to use):", px + 64, py + 64, Theme.DIM, false);
                  int[] palette = EntityColors.palette(entityId);
                  for (int i = 0; i < palette.length && i < 10; i++) {
                      int sx = swatchX(i);
                      int sy = swatchY();
                      boolean hov = mouseX >= sx && mouseX < sx + 14 && mouseY >= sy && mouseY < sy + 14;
                      g.fill(sx, sy, sx + 14, sy + 14, 0xFF000000 | palette[i]);
                      g.drawStrokedRectangle(sx, sy, 14, 14, hov ? 0xFFFFFFFF : 0x60FFFFFF);
                  }

                  for (UiButton b : buttons) {
                      b.draw(g, this.textRenderer, mouseX, mouseY);
                  }

                  int ty = py + 92 + 110 + 24 + (isPlayer() ? 22 : 0);
                  g.drawText(this.textRenderer, "Default: follows F3+B or the hotkey. Always on: forced on.", px + 14, ty, Theme.DIM, false);
                  g.drawText(this.textRenderer, "Never on: hidden. Target/On hit: x clears back to global.", px + 14, ty + 11, Theme.DIM, false);
                  if (isPlayer()) {
                      g.drawText(this.textRenderer, "Elytra/Swimming only: player box shows only during checked actions.", px + 14, ty + 22, Theme.DIM, false);
                  }

                  super.render(g, mouseX, mouseY, delta);
              }

              @Override
              public boolean mouseClicked(Click click, boolean doubled) {
                  if (click.button() == 0) {
                      int[] palette = EntityColors.palette(entityId);
                      for (int i = 0; i < palette.length && i < 10; i++) {
                          if (click.x() >= swatchX(i) && click.x() < swatchX(i) + 14
                              && click.y() >= swatchY() && click.y() < swatchY() + 14) {
                              HitboxConfig.EntitySettings s = HitboxConfig.get().edit(entityId);
                              s.color = palette[i];
                              s.useCustomColor = true;
                              save();
                              return true;
                          }
                      }
                      for (UiButton b : buttons) {
                          if (b.contains(click.x(), click.y())) {
                              b.click();
                              return true;
                          }
                      }
                  }
                  return super.mouseClicked(click, doubled);
              }

              @Override
              public void removed() {
                  HitboxConfig.get().tidy(entityId);
                  HitboxConfig.save();
              }

              @Override
              public void close() {
                  this.client.setScreen(parent);
              }
          }
