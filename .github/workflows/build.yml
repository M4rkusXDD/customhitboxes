              /** Colors that actually appear on the entity, used as recommended swatches. */
              public static int[] palette(String id) {
                  int colon = id.indexOf(':');
                  String namespace = colon >= 0 ? id.substring(0, colon) : "minecraft";
                  String path = colon >= 0 ? id.substring(colon + 1) : id;
                  if (namespace.equals("minecraft")) {
                      int[] known = PALETTES.get(path);
                      if (known != null) {
                          return known;
                      }
                  }
                  int base = forId(id);
                  return new int[]{mix(base, 0x000000, 0.55f), mix(base, 0x000000, 0.3f), base,
                      mix(base, 0xFFFFFF, 0.3f), mix(base, 0xFFFFFF, 0.6f)};
              }

              private static int mix(int a, int b, float t) {
                  int r = Math.round(((a >> 16) & 0xFF) * (1 - t) + ((b >> 16) & 0xFF) * t);
                  int g = Math.round(((a >> 8) & 0xFF) * (1 - t) + ((b >> 8) & 0xFF) * t);
                  int bl = Math.round((a & 0xFF) * (1 - t) + (b & 0xFF) * t);
                  return (r << 16) | (g << 8) | bl;
              }

              private EntityColors() {
              }

              public static int forId(String id) {
                  int colon = id.indexOf(':');
                  String namespace = colon >= 0 ? id.substring(0, colon) : "minecraft";
                  String path = colon >= 0 ? id.substring(colon + 1) : id;

                  if (namespace.equals("minecraft")) {
                      Integer known = BY_PATH.get(path);
                      if (known != null) {
                          return known;
                      }
                  }
                  // Stable fallback color so modded entities are still distinguishable.
                  int hash = id.hashCode();
                  float hue = ((hash & 0x7FFFFFFF) % 360) / 360.0f;
                  return hsvToRgb(hue, 0.65f, 1.0f);
              }

              public static int hsvToRgb(float h, float s, float v) {
                  float c = v * s;
                  float hp = (h * 6.0f) % 6.0f;
                  float x = c * (1.0f - Math.abs(hp % 2.0f - 1.0f));
                  float r = 0, g = 0, b = 0;
                  switch ((int) hp) {
                      case 0 -> { r = c; g = x; }
                      case 1 -> { r = x; g = c; }
                      case 2 -> { g = c; b = x; }
                      case 3 -> { g = x; b = c; }
                      case 4 -> { r = x; b = c; }
                      default -> { r = c; b = x; }
                  }
                  float m = v - c;
                  int ri = Math.round((r + m) * 255.0f);
                  int gi = Math.round((g + m) * 255.0f);
                  int bi = Math.round((b + m) * 255.0f);
                  return (ri << 16) | (gi << 8) | bi;
              }

              /** Returns {h, s, v}, each in 0..1. */
              public static float[] rgbToHsv(int rgb) {
                  float r = ((rgb >> 16) & 0xFF) / 255.0f;
                  float g = ((rgb >> 8) & 0xFF) / 255.0f;
                  float b = (rgb & 0xFF) / 255.0f;
                  float max = Math.max(r, Math.max(g, b));
                  float min = Math.min(r, Math.min(g, b));
                  float d = max - min;
                  float h;
                  if (d == 0) {
                      h = 0;
                  } else if (max == r) {
                      h = ((g - b) / d) % 6.0f;
                  } else if (max == g) {
                      h = (b - r) / d + 2.0f;
                  } else {
                      h = (r - g) / d + 4.0f;
                  }
                  h /= 6.0f;
                  if (h < 0) {
                      h += 1.0f;
                  }
                  float s = max == 0 ? 0 : d / max;
                  return new float[]{h, s, max};
              }
          }
          HB_EOF
          mkdir -p src/main/java/com/hitboxcustomizer
          cat > src/main/java/com/hitboxcustomizer/HitboxCustomizerClient.java <<'HB_EOF'
          package com.hitboxcustomizer;

          import com.hitboxcustomizer.config.HitboxConfig;
          import com.hitboxcustomizer.gui.HitboxMenuScreen;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;

          public class HitboxCustomizerClient implements ClientModInitializer {
              public static final String MOD_ID = "hitboxcustomizer";

              private static final KeyBinding.Category CATEGORY =
                  KeyBinding.Category.create(Identifier.of(MOD_ID, "main"));

              private static KeyBinding openMenuKey;
              private static KeyBinding toggleHitboxesKey;

              @Override
              public void onInitializeClient() {
                  HitboxConfig.load();

                  // Opens the menu. Defaults to H, rebindable in Options > Controls.
                  openMenuKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                      "key.hitboxcustomizer.open_menu", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_H, CATEGORY));

                  // Quick on/off for hitboxes (same effect as F3+B). Unbound by default.
                  toggleHitboxesKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                      "key.hitboxcustomizer.toggle_hitboxes", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_UNKNOWN, CATEGORY));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (openMenuKey.wasPressed()) {
                          if (client.currentScreen == null) {
                              client.setScreen(new HitboxMenuScreen(null));
                          }
                      }
                      while (toggleHitboxesKey.wasPressed()) {
                          HitboxRenderer.quickToggle(client);
                      }
                  });
              }
          }
          HB_EOF
          mkdir -p src/main/java/com/hitboxcustomizer
          cat > src/main/java/com/hitboxcustomizer/HitboxRenderer.java <<'HB_EOF'
          package com.hitboxcustomizer;

          import com.hitboxcustomizer.config.HitboxConfig;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.render.DrawStyle;
          import net.minecraft.client.render.Frustum;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.EntityType;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.boss.dragon.EnderDragonEntity;
          import net.minecraft.entity.boss.dragon.EnderDragonPart;
          import net.minecraft.registry.Registries;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.math.Box;
          import net.minecraft.util.math.Vec3d;
          import net.minecraft.world.debug.gizmo.GizmoDrawing;

          import java.util.HashMap;
          import java.util.Map;

          /**
           * Draws hitboxes itself and silences vanilla's per-entity drawing, so color and visibility can be
           * controlled per entity type. Vanilla's F3+B state is still respected: "Default" visibility means
           * "visible while F3+B (or the quick toggle hotkey) has hitboxes on".
           */
          public final class HitboxRenderer {
              private static final Identifier VANILLA_HITBOX_ENTRY = Identifier.ofVanilla("entity_hitboxes");
              private static final Map<EntityType<?>, String> ID_CACHE = new HashMap<>();

              /** Set by the vanilla hitbox renderer mixin whenever vanilla would draw hitboxes this frame. */
              public static boolean vanillaSeen = false;
              private static boolean vanillaActive = false;
              /** State of the quick toggle hotkey. */
              private static boolean quickOn = false;

              private HitboxRenderer() {
              }

              public static boolean isDefaultOn() {
                  return quickOn || vanillaActive;
              }

              public static void quickToggle(MinecraftClient mc) {
                  if (isDefaultOn()) {
                      quickOn = false;
                      if (vanillaActive) {
                          try {
                              mc.debugHudEntryList.toggleVisibility(VANILLA_HITBOX_ENTRY);
                          } catch (Throwable ignored) {
                              // If this ever fails, F3+B still works for turning vanilla hitboxes off.
                          }
                      }
                  } else {
                      quickOn = true;
                  }
                  if (mc.player != null) {
                      mc.player.sendMessage(Text.literal("Hitboxes: " + (isDefaultOn() ? "ON" : "OFF")), true);
                  }
              }

              public static void onFrame(Frustum frustum, double camX, double camY, double camZ, float tickProgress) {
                  vanillaActive = vanillaSeen;
                  vanillaSeen = false;
                  render(frustum, camX, camY, camZ, tickProgress);
              }

              public static String idOf(Entity entity) {
                  return ID_CACHE.computeIfAbsent(entity.getType(), t -> Registries.ENTITY_TYPE.getId(t).toString());
              }

              private static void render(Frustum frustum, double camX, double camY, double camZ, float tickProgress) {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  HitboxConfig cfg = HitboxConfig.get();
                  if (!cfg.enabled || mc.world == null) {
                      return;
                  }

                  boolean defaultOn = isDefaultOn();
                  boolean firstPerson = mc.options.getPerspective().isFirstPerson();

                  for (Entity entity : mc.world.getEntities()) {
                      if (entity == mc.player && firstPerson) {
                          continue;
                      }

                      String id = idOf(entity);
                      boolean show = switch (cfg.modeFor(id)) {
                          case ALWAYS -> true;
                          case NEVER -> false;
                          case DEFAULT -> defaultOn;
                      };
                      if (!show || !cfg.passesStateFilter(id, entity)) {
                          continue;
                      }

                      Vec3d lerped = entity.getLerpedPos(tickProgress);
                      Box box = entity.getBoundingBox().offset(
                          lerped.x - entity.getX(), lerped.y - entity.getY(), lerped.z - entity.getZ());
                      if (!(entity instanceof EnderDragonEntity) && !frustum.isVisible(box.expand(0.5))) {
                          continue;
                      }

                      boolean hit = entity instanceof LivingEntity living && living.hurtTime > 0;
                      boolean targeted = entity == mc.targetedEntity;
                      int argb = 0xFF000000 | cfg.finalColor(id, hit, targeted);
                      float width = cfg.thicknessFor(id);
                      DrawStyle style = width > 0f ? DrawStyle.stroked(argb, width) : DrawStyle.stroked(argb);
                      GizmoDrawing.box(box, style);

                      if (entity instanceof EnderDragonEntity dragon) {
                          for (EnderDragonPart part : dragon.getBodyParts()) {
                              GizmoDrawing.box(part.getBoundingBox(), style);
                          }
                      }

                      if (entity instanceof LivingEntity) {
                          double eyeY = lerped.y + entity.getStandingEyeHeight();
                          if (cfg.showEyeLine) {
                              Box eye = new Box(box.minX, eyeY - 0.01, box.minZ, box.maxX, eyeY + 0.01, box.maxZ);
                              GizmoDrawing.box(eye, width > 0f ? DrawStyle.stroked(0xFFFF0000, width) : DrawStyle.stroked(0xFFFF0000));
                          }
                          if (cfg.showLookVector) {
                              Vec3d start = new Vec3d(lerped.x, eyeY, lerped.z);
                              Vec3d end = start.add(entity.getRotationVec(tickProgress).multiply(2.0));
                              if (width > 0f) {
                                  GizmoDrawing.line(start, end, 0xFF0000FF, width);
                              } else {
                                  GizmoDrawing.line(start, end, 0xFF0000FF);
                              }
                          }
                      }
                  }
              }
          }
