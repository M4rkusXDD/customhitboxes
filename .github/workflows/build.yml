          package com.hitboxcustomizer.config;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import com.hitboxcustomizer.EntityColors;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.Reader;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.HashMap;
          import java.util.Map;

          public class HitboxConfig {

              public enum Mode {
                  DEFAULT("Default"),
                  ALWAYS("Always on"),
                  NEVER("Never on");

                  private final String label;

                  Mode(String label) {
                      this.label = label;
                  }

                  public String label() {
                      return label;
                  }

                  public Mode next() {
                      Mode[] all = values();
                      return all[(ordinal() + 1) % all.length];
                  }
              }

              public static class EntitySettings {
                  public boolean useCustomColor = false;
                  public int color = 0xFFFFFF;
                  public Mode mode = Mode.DEFAULT;
                  // Line thickness. 0 means vanilla's default.
                  public float thickness = 0f;
                  // Per-entity colors for the targeted and on-hit states. null means use the global color.
                  // Player only: show the hitbox only while gliding with an elytra and/or swimming.
                  public boolean onlyElytra = false;
                  public boolean onlySwimming = false;
                  public Integer targetColor = null;
                  public Integer hitColor = null;

                  public boolean isDefault() {
                      return !useCustomColor && mode == Mode.DEFAULT && thickness <= 0f
                          && targetColor == null && hitColor == null
                          && !onlyElytra && !onlySwimming;
                  }
              }

              // Master switch. When off, vanilla hitbox rendering is left completely alone.
              public boolean enabled = true;
              // Use a themed color for every entity (creeper green, enderman purple, ...).
              public boolean presetColors = false;
              // Force every hitbox to one color. Wins over everything else.
              public boolean globalColorEnabled = false;
              public int globalColor = 0xFFFFFF;
              // Vanilla extras: red eye-height line and blue look vector.
              // Color while the crosshair is on the entity. Applies to every entity.
              public boolean targetColorEnabled = false;
              public int targetColor = 0xFFFF00;
              // Color while the entity is flashing red from being hit. Applies to every entity.
              public boolean hitColorEnabled = false;
              public int hitColor = 0xFF0000;
              public boolean showEyeLine = true;
              public boolean showLookVector = true;
              // Per entity type settings, keyed by registry id such as "minecraft:creeper".
              public Map<String, EntitySettings> entities = new HashMap<>();

              // ---- lookups ----

              /** Restores every setting to its default. Hotkeys are vanilla key bindings and are not touched. */
              public void resetAll() {
                  HitboxConfig defaults = new HitboxConfig();
                  enabled = defaults.enabled;
                  presetColors = defaults.presetColors;
                  globalColorEnabled = defaults.globalColorEnabled;
                  globalColor = defaults.globalColor;
                  targetColorEnabled = defaults.targetColorEnabled;
                  targetColor = defaults.targetColor;
                  hitColorEnabled = defaults.hitColorEnabled;
                  hitColor = defaults.hitColor;
                  showEyeLine = defaults.showEyeLine;
                  showLookVector = defaults.showLookVector;
                  entities = new HashMap<>();
              }

              public EntitySettings settings(String id) {
                  return entities.get(id);
              }

              public EntitySettings edit(String id) {
                  return entities.computeIfAbsent(id, key -> new EntitySettings());
              }

              public void tidy(String id) {
                  EntitySettings s = entities.get(id);
                  if (s != null && s.isDefault()) {
                      entities.remove(id);
                  }
              }

              public Mode modeFor(String id) {
                  EntitySettings s = entities.get(id);
                  return s == null || s.mode == null ? Mode.DEFAULT : s.mode;
              }

              /** Hit color beats targeted color, which beats the normal color. */
              public int finalColor(String id, boolean hit, boolean targeted) {
                  EntitySettings s = entities.get(id);
                  if (hit) {
                      if (s != null && s.hitColor != null) {
                          return s.hitColor & 0xFFFFFF;
                      }
                      if (hitColorEnabled) {
                          return hitColor & 0xFFFFFF;
                      }
                  }
                  if (targeted) {
                      if (s != null && s.targetColor != null) {
                          return s.targetColor & 0xFFFFFF;
                      }
                      if (targetColorEnabled) {
                          return targetColor & 0xFFFFFF;
                      }
                  }
                  return colorFor(id);
              }

              public int effectiveTargetColor(String id) {
                  EntitySettings s = entities.get(id);
                  return (s != null && s.targetColor != null ? s.targetColor : targetColor) & 0xFFFFFF;
              }

              public int effectiveHitColor(String id) {
                  EntitySettings s = entities.get(id);
                  return (s != null && s.hitColor != null ? s.hitColor : hitColor) & 0xFFFFFF;
              }

              /** False when a player-only elytra/swimming filter hides this entity right now. */
              public boolean passesStateFilter(String id, net.minecraft.entity.Entity entity) {
                  EntitySettings s = entities.get(id);
                  if (s == null || (!s.onlyElytra && !s.onlySwimming)) {
                      return true;
                  }
                  if (!(entity instanceof net.minecraft.entity.LivingEntity living)) {
                      return true;
                  }
                  return (s.onlyElytra && living.isGliding()) || (s.onlySwimming && living.isSwimming());
              }

              public float thicknessFor(String id) {
                  EntitySettings s = entities.get(id);
                  return s == null ? 0f : Math.max(0f, s.thickness);
              }

              /** Priority: global override, then the entity's own color, then preset, then vanilla white. */
              public int colorFor(String id) {
                  if (globalColorEnabled) {
                      return globalColor & 0xFFFFFF;
                  }
                  EntitySettings s = entities.get(id);
                  if (s != null && s.useCustomColor) {
                      return s.color & 0xFFFFFF;
                  }
                  if (presetColors) {
                      return EntityColors.forId(id);
                  }
                  return 0xFFFFFF;
              }

              public String colorSource(String id) {
                  if (globalColorEnabled) {
                      return "Override-all color";
                  }
                  EntitySettings s = entities.get(id);
                  if (s != null && s.useCustomColor) {
                      return "Custom color";
                  }
                  if (presetColors) {
                      return "Preset color";
                  }
                  return "Vanilla white";
              }

              // ---- persistence ----

              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static HitboxConfig instance = new HitboxConfig();

              public static HitboxConfig get() {
                  return instance;
              }

              private static Path path() {
                  return FabricLoader.getInstance().getConfigDir().resolve("hitboxcustomizer.json");
              }

              public static void load() {
                  Path p = path();
                  if (Files.exists(p)) {
                      try (Reader reader = Files.newBufferedReader(p)) {
                          HitboxConfig loaded = GSON.fromJson(reader, HitboxConfig.class);
                          if (loaded != null) {
                              instance = loaded;
                          }
                      } catch (Exception e) {
                          System.err.println("[Hitbox Customizer] Could not read config, using defaults: " + e);
                      }
                  }
                  instance.normalize();
                  save();
              }

              public static void save() {
                  try {
                      Files.writeString(path(), GSON.toJson(instance));
                  } catch (Exception e) {
                      System.err.println("[Hitbox Customizer] Could not write config: " + e);
                  }
              }

              private void normalize() {
                  if (entities == null) {
                      entities = new HashMap<>();
                  }
                  entities.values().removeIf(s -> s == null);
                  for (EntitySettings s : entities.values()) {
                      if (s.mode == null) {
                          s.mode = Mode.DEFAULT;
                      }
                  }
              }
          }
