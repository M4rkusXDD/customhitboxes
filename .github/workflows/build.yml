          cat > src/main/java/com/hitboxcustomizer/mixin/EntityHitboxDebugRendererMixin.java <<'HB_EOF'
          package com.hitboxcustomizer.mixin;

          import com.hitboxcustomizer.HitboxRenderer;
          import com.hitboxcustomizer.config.HitboxConfig;
          import net.minecraft.client.render.debug.EntityHitboxDebugRenderer;
          import net.minecraft.entity.Entity;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(EntityHitboxDebugRenderer.class)
          public class EntityHitboxDebugRendererMixin {

              // Vanilla only runs this renderer while F3+B hitboxes are on, so it doubles as a state probe.
              @Inject(method = "render", at = @At("HEAD"))
              private void hitboxcustomizer$vanillaIsOn(CallbackInfo ci) {
                  HitboxRenderer.vanillaSeen = true;
              }

              // Our renderer draws every box, so vanilla's own per-entity drawing is cancelled.
              @Inject(method = "drawHitbox", at = @At("HEAD"), cancellable = true)
              private void hitboxcustomizer$cancelVanilla(Entity entity, float tickProgress, boolean inLocalServer,
                                                          CallbackInfo ci) {
                  if (HitboxConfig.get().enabled) {
                      ci.cancel();
                  }
              }
          }
          HB_EOF

      - name: Build jar
        working-directory: mod
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: hitbox-customizer
          path: mod/build/libs/*.jar
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mod/build/libs/*.jar
