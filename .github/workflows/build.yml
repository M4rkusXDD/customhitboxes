          package com.hitboxcustomizer.mixin;

          import com.hitboxcustomizer.HitboxRenderer;
          import net.minecraft.client.render.Frustum;
          import net.minecraft.client.render.debug.DebugRenderer;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(DebugRenderer.class)
          public class DebugRendererMixin {

              // Runs once per frame while debug gizmos are being collected.
              @Inject(method = "render", at = @At("HEAD"))
              private void hitboxcustomizer$onRender(Frustum frustum, double cameraX, double cameraY, double cameraZ,
                                                     float tickProgress, CallbackInfo ci) {
                  HitboxRenderer.onFrame(frustum, cameraX, cameraY, cameraZ, tickProgress);
              }
          }
