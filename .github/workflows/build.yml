name: Build Hitbox Customizer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Write mod project files
        run: |
          mkdir -p mod && cd mod
          cat > settings.gradle <<'HB_EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'hitbox-customizer'
          HB_EOF
          cat > gradle.properties <<'HB_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Minecraft / Fabric (1.21.11 is the last version that uses Yarn)
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          fabric_version=0.141.3+1.21.11

          # Mod Menu is compile-only (optional at runtime)
          modmenu_version=17.0.0

          # Mod metadata
          mod_version=1.0.0
          maven_group=com.hitboxcustomizer
          archives_base_name=hitbox-customizer
          HB_EOF
          cat > build.gradle <<'HB_EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              maven { url "https://maven.terraformersmc.com/releases/" }
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

              // Only needed to compile the Mod Menu entrypoint. Players install Mod Menu themselves.
              modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          HB_EOF
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'HB_EOF'
          {
            "schemaVersion": 1,
            "id": "hitboxcustomizer",
            "version": "${version}",
            "name": "Hitbox Customizer",
            "description": "Customize the color, thickness and visibility of every entity's hitbox. Press H to open the menu. Made by M4rkusXDD. Icon by Beezwho. Website: https://modrinth.com/project/Customized-Hitboxes",
            "contact": {
              "homepage": "https://modrinth.com/project/Customized-Hitboxes"
            },
            "authors": ["M4rkusXDD"],
            "contributors": {
              "Beezwho": "Icon"
            },
            "license": "MIT",
            "icon": "assets/hitboxcustomizer/icon.png",
            "environment": "client",
            "entrypoints": {
              "client": ["com.hitboxcustomizer.HitboxCustomizerClient"],
              "modmenu": ["com.hitboxcustomizer.gui.ModMenuIntegration"]
            },
            "mixins": ["hitboxcustomizer.mixins.json"],
            "depends": {
              "fabricloader": ">=0.18.1",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            },
            "suggests": {
              "modmenu": "*"
            },
            "custom": {
              "modmenu": {
                "links": {
                  "Modrinth": "https://modrinth.com/project/Customized-Hitboxes"
                }
              }
            }
          }
          HB_EOF
          mkdir -p src/main/resources
          cat > src/main/resources/hitboxcustomizer.mixins.json <<'HB_EOF'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.hitboxcustomizer.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "DebugRendererMixin",
              "EntityHitboxDebugRendererMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          HB_EOF
          mkdir -p src/main/resources/assets/hitboxcustomizer/lang
          cat > src/main/resources/assets/hitboxcustomizer/lang/en_us.json <<'HB_EOF'
          {
            "key.category.hitboxcustomizer.main": "Hitbox Customizer",
            "key.hitboxcustomizer.open_menu": "Open Hitbox Menu",
            "key.hitboxcustomizer.toggle_hitboxes": "Toggle Hitboxes"
          }
          HB_EOF
          mkdir -p src/main/java/com/hitboxcustomizer
          cat > src/main/java/com/hitboxcustomizer/EntityColors.java <<'HB_EOF'
