          package com.hitboxcustomizer.gui;

          import com.hitboxcustomizer.EntityColors;
          import net.minecraft.client.gui.Click;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.TextFieldWidget;
          import net.minecraft.text.Text;
          import net.minecraft.util.math.MathHelper;

          import java.util.Locale;
          import java.util.function.IntConsumer;

          /** Hue bar + saturation/brightness square + hex box. */
          public class ColorPickerScreen extends Screen {
              private static final int SV = 120;
              private static final int PW = 262;
              private static final int PH = 214;
              private static final int[] PRESETS = {
                  0xFFFFFF, 0xFF4D4D, 0xFFA94D, 0xFFE14D, 0x4DFF6E,
                  0x4DFFE1, 0x4D9EFF, 0x9B4DFF, 0xFF4DD8, 0x000000
              };

              private final Screen parent;
              private final IntConsumer onApply;
              private final int originalRgb;
              private float hue;
              private float sat;
              private float val;
              private int drag = 0; // 0 none, 1 square, 2 hue bar

              private TextFieldWidget hexField;
              private boolean syncing;
              private UiButton apply;
              private UiButton cancel;

              public ColorPickerScreen(Screen parent, String title, int startRgb, IntConsumer onApply) {
                  super(Text.literal(title));
                  this.parent = parent;
                  this.onApply = onApply;
                  this.originalRgb = startRgb & 0xFFFFFF;
                  float[] hsv = EntityColors.rgbToHsv(originalRgb);
                  this.hue = hsv[0];
                  this.sat = hsv[1];
                  this.val = hsv[2];
              }

              private int px() {
                  return (this.width - PW) / 2;
              }

              private int py() {
                  return (this.height - PH) / 2;
              }

              private int svX() {
                  return px() + 14;
              }

              private int svY() {
                  return py() + 30;
              }

              private int hueX() {
                  return svX() + SV + 10;
              }

              private int rightX() {
                  return hueX() + 14 + 12;
              }

              private int rightW() {
                  return px() + PW - 14 - rightX();
              }

              private int presetsY() {
                  return svY() + SV + 10;
              }

              private int rgb() {
                  return EntityColors.hsvToRgb(hue, sat, val);
              }

              private String hex() {
                  return String.format(Locale.ROOT, "#%06X", rgb());
              }

              @Override
              protected void init() {
                  hexField = new TextFieldWidget(this.textRenderer, rightX(), svY() + 58, rightW(), 16, Text.literal("Hex"));
                  hexField.setMaxLength(7);
                  hexField.setText(hex());
                  hexField.setChangedListener(text -> {
                      if (syncing) {
                          return;
                      }
                      String raw = text.startsWith("#") ? text.substring(1) : text;
                      if (raw.length() == 3) {
                          raw = "" + raw.charAt(0) + raw.charAt(0) + raw.charAt(1) + raw.charAt(1) + raw.charAt(2) + raw.charAt(2);
                      }
                      if (raw.length() == 6) {
                          try {
                              float[] hsv = EntityColors.rgbToHsv(Integer.parseInt(raw, 16));
                              hue = hsv[0];
                              sat = hsv[1];
                              val = hsv[2];
                          } catch (NumberFormatException ignored) {
                          }
                      }
                  });
                  addDrawableChild(hexField);

                  int by = py() + PH - 26;
                  apply = new UiButton(px() + PW - 14 - 70, by, 70, 18, () -> "Apply", () -> {
                      onApply.accept(rgb());
                      close();
                  });
                  cancel = new UiButton(px() + PW - 14 - 70 - 6 - 60, by, 60, 18, () -> "Cancel", this::close);
              }

              private void syncHex() {
                  syncing = true;
                  hexField.setText(hex());
                  syncing = false;
              }

              @Override
              public void render(DrawContext g, int mouseX, int mouseY, float delta) {
                  g.fill(0, 0, this.width, this.height, Theme.DIM_BG);

                  int px = px();
                  int py = py();
                  g.fill(px, py, px + PW, py + PH, Theme.PANEL);
                  g.drawStrokedRectangle(px, py, PW, PH, Theme.BORDER);
                  g.drawText(this.textRenderer, this.title, px + 14, py + 10, Theme.TEXT, false);

                  // Saturation (x) and brightness (y) square.
                  int sx = svX();
                  int sy = svY();
                  for (int i = 0; i < SV; i++) {
                      float s = i / (float) (SV - 1);
                      int top = 0xFF000000 | EntityColors.hsvToRgb(hue, s, 1.0f);
                      g.fillGradient(sx + i, sy, sx + i + 1, sy + SV, top, 0xFF000000);
                  }
                  g.drawStrokedRectangle(sx - 1, sy - 1, SV + 2, SV + 2, Theme.BORDER);
                  int mx = sx + Math.round(sat * (SV - 1));
                  int my = sy + Math.round((1.0f - val) * (SV - 1));
                  g.drawStrokedRectangle(mx - 4, my - 4, 9, 9, 0xFF000000);
                  g.drawStrokedRectangle(mx - 3, my - 3, 7, 7, 0xFFFFFFFF);

                  // Hue bar.
                  int hx = hueX();
                  int seg = SV / 6;
                  for (int k = 0; k < 6; k++) {
                      int c1 = 0xFF000000 | EntityColors.hsvToRgb((k / 6.0f) % 1.0f, 1.0f, 1.0f);
                      int c2 = 0xFF000000 | EntityColors.hsvToRgb(((k + 1) / 6.0f) % 1.0f, 1.0f, 1.0f);
                      g.fillGradient(hx, sy + k * seg, hx + 14, sy + (k + 1) * seg, c1, c2);
                  }
                  g.drawStrokedRectangle(hx - 1, sy - 1, 16, SV + 2, Theme.BORDER);
                  int hy = sy + Math.round(hue * (SV - 1));
                  g.drawStrokedRectangle(hx - 3, hy - 2, 20, 5, 0xFFFFFFFF);

                  // Preview: new color on top, original underneath.
                  int rx = rightX();
                  int rw = rightW();
                  g.drawText(this.textRenderer, "New", rx, sy, Theme.DIM, false);
                  g.fill(rx, sy + 10, rx + rw, sy + 30, 0xFF000000 | rgb());
                  g.drawStrokedRectangle(rx, sy + 10, rw, 20, Theme.BORDER);
                  g.drawText(this.textRenderer, "Old", rx, sy + 33, Theme.DIM, false);
                  g.fill(rx, sy + 43, rx + rw / 2, sy + 51, 0xFF000000 | originalRgb);
                  g.drawText(this.textRenderer, "Hex", rx, sy + 90, Theme.DIM, false);

                  // Quick presets.
                  int pyy = presetsY();
                  for (int i = 0; i < PRESETS.length; i++) {
                      int x = px + 14 + i * 16;
                      boolean hov = mouseX >= x && mouseX < x + 12 && mouseY >= pyy && mouseY < pyy + 12;
                      g.fill(x, pyy, x + 12, pyy + 12, 0xFF000000 | PRESETS[i]);
                      g.drawStrokedRectangle(x, pyy, 12, 12, hov ? 0xFFFFFFFF : 0x60FFFFFF);
                  }

                  super.render(g, mouseX, mouseY, delta);
                  apply.draw(g, this.textRenderer, mouseX, mouseY);
                  cancel.draw(g, this.textRenderer, mouseX, mouseY);
              }

              private void updateSquare(double mx, double my) {
                  sat = MathHelper.clamp((float) ((mx - svX()) / (SV - 1)), 0.0f, 1.0f);
                  val = 1.0f - MathHelper.clamp((float) ((my - svY()) / (SV - 1)), 0.0f, 1.0f);
                  syncHex();
              }

              private void updateHue(double my) {
                  hue = MathHelper.clamp((float) ((my - svY()) / (SV - 1)), 0.0f, 0.9999f);
                  syncHex();
              }

              @Override
              public boolean mouseClicked(Click click, boolean doubled) {
                  if (super.mouseClicked(click, doubled)) {
                      return true;
                  }
                  if (click.button() != 0) {
                      return false;
                  }
                  double mx = click.x();
                  double my = click.y();

                  if (mx >= svX() && mx < svX() + SV && my >= svY() && my < svY() + SV) {
                      drag = 1;
                      updateSquare(mx, my);
                      return true;
                  }
                  if (mx >= hueX() - 2 && mx < hueX() + 16 && my >= svY() && my < svY() + SV) {
                      drag = 2;
                      updateHue(my);
                      return true;
                  }
                  for (int i = 0; i < PRESETS.length; i++) {
                      int x = px() + 14 + i * 16;
                      if (mx >= x && mx < x + 12 && my >= presetsY() && my < presetsY() + 12) {
                          float[] hsv = EntityColors.rgbToHsv(PRESETS[i]);
                          hue = hsv[0];
                          sat = hsv[1];
                          val = hsv[2];
                          syncHex();
                          return true;
                      }
                  }
                  if (apply.contains(mx, my)) {
                      apply.click();
                      return true;
                  }
                  if (cancel.contains(mx, my)) {
                      cancel.click();
                      return true;
                  }
                  return false;
              }

              @Override
              public boolean mouseDragged(Click click, double offsetX, double offsetY) {
                  if (drag == 1) {
                      updateSquare(click.x(), click.y());
                      return true;
                  }
                  if (drag == 2) {
                      updateHue(click.y());
                      return true;
                  }
                  return super.mouseDragged(click, offsetX, offsetY);
              }

              @Override
              public boolean mouseReleased(Click click) {
                  if (drag != 0) {
                      drag = 0;
                      return true;
                  }
                  return super.mouseReleased(click);
              }

              @Override
              public void close() {
                  this.client.setScreen(parent);
              }
          }
